name: Engineering checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - run: uv venv .wheel-smoke --python 3.13
      - run: uv pip install --python .wheel-smoke/bin/python dist/*.whl
      - name: Run the installed wheel outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m hilconv list
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m hilconv run --case deadtime-voltage-error --output /tmp/hilconv-wheel-report
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/python" -m hilconv verify /tmp/hilconv-wheel-report
